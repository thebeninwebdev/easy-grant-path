name: Sync opportunities
on:
  schedule:
    - cron: "17 6 * * *" # Grants.gov, UNDP, ACCF, UN MPTF daily
    - cron: "17 18 * * *" # Grants.gov and ECOWAS; ECOWAS every 12 hours
  workflow_dispatch:
    inputs:
      source:
        description: "Source slug, or all"
        required: false
        default: all
permissions:
  contents: read
concurrency:
  group: easygrantpath-opportunity-sync-${{ github.event.inputs.source || github.event.schedule }}
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Validate configuration
        env:
          SYNC_URL: ${{ secrets.EASYGRANTPATH_SYNC_URL }}
          SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
        run: |
          test -n "$SYNC_URL" || { echo "::error::EASYGRANTPATH_SYNC_URL is missing"; exit 1; }
          test -n "$SYNC_SECRET" || { echo "::error::SYNC_SECRET is missing"; exit 1; }
      - name: Trigger protected independent syncs
        env:
          SYNC_URL: ${{ secrets.EASYGRANTPATH_SYNC_URL }}
          SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
          REQUESTED_SOURCE: ${{ github.event.inputs.source }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ -n "$REQUESTED_SOURCE" ] && [ "$REQUESTED_SOURCE" != all ]; then sources="$REQUESTED_SOURCE";
          elif [ "$SCHEDULE" = "17 18 * * *" ]; then sources="grants-gov ecowas";
          else sources="grants-gov ecowas undp afdb-accf un-mptf"; fi
          for source in $sources; do
            response_file="$(mktemp)"; trap 'rm -f "$response_file"' EXIT
            echo "Syncing $source"
            curl --fail-with-body --show-error --silent --max-time 240 --retry 2 --retry-all-errors --output "$response_file" --request POST "$SYNC_URL" --header "Authorization: Bearer $SYNC_SECRET" --header "Content-Type: application/json" --data "{\"source\":\"$source\"}"
            jq -e --arg source "$source" '.data and .data.source == $source and (.data.status == "success" or .data.status == "partial")' "$response_file" >/dev/null
            jq -r '"status=\(.data.status) fetched=\(.data.fetched) created=\(.data.created) updated=\(.data.updated) skipped=\(.data.skipped) irrelevant=\(.data.irrelevant) failed=\(.data.failed)"' "$response_file"
          done